steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gemini-screen-navigator:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gemini-screen-navigator:latest'
      - '.'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/gemini-screen-navigator:$SHORT_SHA'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--filename=.'
      - '--image=gcr.io/$PROJECT_ID/gemini-screen-navigator:$SHORT_SHA'
      - '--location=us-central1'
      - '--output=/workspace/output'

  # Step 4: Deploy using gcloud
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'gemini-screen-navigator'
      - '--image=gcr.io/$PROJECT_ID/gemini-screen-navigator:$SHORT_SHA'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--set-env-vars=GEMINI_API_KEY=$_GEMINI_API_KEY,GCP_PROJECT_ID=$PROJECT_ID'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=3600'

images:
  - 'gcr.io/$PROJECT_ID/gemini-screen-navigator:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/gemini-screen-navigator:latest'

substitutions:
  _GEMINI_API_KEY: ''

options:
  machineType: 'N1_HIGHCPU_8'

timeout: '3600s'
